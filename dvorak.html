<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dvorak Keyboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="keyboard-page" aria-label="Dvorak keyboard layout">
      <section class="keyboard-shell">
        <div class="keyboard-row number-row">
          <div class="key">`</div>
          <div class="key">1</div>
          <div class="key">2</div>
          <div class="key">3</div>
          <div class="key">4</div>
          <div class="key">5</div>
          <div class="key">6</div>
          <div class="key">7</div>
          <div class="key">8</div>
          <div class="key">9</div>
          <div class="key">0</div>
          <div class="key">[</div>
          <div class="key">]</div>
        </div>

        <div class="keyboard-row top-letter-row">
          <div class="key">'</div>
          <div class="key">,</div>
          <div class="key">.</div>
          <div class="key">P</div>
          <div class="key">Y</div>
          <div class="key">F</div>
          <div class="key">G</div>
          <div class="key">C</div>
          <div class="key">R</div>
          <div class="key">L</div>
          <div class="key">/</div>
          <div class="key">=</div>
          <div class="key">\</div>
        </div>

        <div class="keyboard-row home-row">
          <div class="key">A</div>
          <div class="key">O</div>
          <div class="key">E</div>
          <div class="key">U</div>
          <div class="key">I</div>
          <div class="key">D</div>
          <div class="key">H</div>
          <div class="key">T</div>
          <div class="key">N</div>
          <div class="key">S</div>
          <div class="key">-</div>
        </div>

        <div class="keyboard-row lower-row">
          <div class="key">;</div>
          <div class="key">Q</div>
          <div class="key">J</div>
          <div class="key">K</div>
          <div class="key">X</div>
          <div class="key">B</div>
          <div class="key">M</div>
          <div class="key">W</div>
          <div class="key">V</div>
          <div class="key">Z</div>
        </div>
      </section>
    </main>
  </body>
</html>
